<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Confessions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a2332 0%, #2c3e50 25%, #34495e 50%, #2c3e50 75%, #1a2332 100%);
            color: #ecf0f1;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(52, 152, 219, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(41, 128, 185, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(223, 230, 233, 0.03) 0%, transparent 70%),
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(52, 152, 219, 0.02) 40px, rgba(52, 152, 219, 0.02) 41px),
                repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(41, 128, 185, 0.02) 40px, rgba(41, 128, 185, 0.02) 41px),
                repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(223, 230, 233, 0.01) 60px, rgba(223, 230, 233, 0.01) 61px);
            pointer-events: none;
            z-index: 1;
            animation: airforcePulse 10s ease-in-out infinite;
        }
        
        @keyframes airforcePulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.01); }
        }
        
        body::after {
            content: '✈️ 🛩️ 🚁 🎯 ✈️ 🛩️ 🚁 🎯';
            position: fixed;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2em;
            opacity: 0.15;
            animation: airforceFly 12s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }
        
        @keyframes airforceFly {
            0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.15; }
            25% { transform: translateX(-50%) translateY(-10px); opacity: 0.2; }
            50% { transform: translateX(-50%) translateY(-20px); opacity: 0.25; }
            75% { transform: translateX(-50%) translateY(-10px); opacity: 0.2; }
        }

        /* ── Layout ─────────────────────────────────── */
        .timeline {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(26, 35, 50, 0.95) 0%, rgba(44, 62, 80, 0.95) 100%);
            min-height: 100vh;
            border-left: 2px solid #000000;
            border-right: 2px solid #000000;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(15px);
            box-shadow: 
                0 4px 20px rgba(52, 152, 219, 0.15),
                inset 0 0 20px rgba(41, 128, 185, 0.08);
        }
        
        .timeline::before {
            content: '✈️ 🎯 ✈️';
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2em;
            opacity: 0.6;
            animation: airforceAccent 4s ease-in-out infinite;
        }
        
        @keyframes airforceAccent {
            0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.8; transform: translateX(-50%) scale(1.1); }
        }

        /* ── Header ─────────────────────────────────── */
        .top-bar {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.95) 0%, rgba(41, 128, 185, 0.95) 50%, rgba(52, 152, 219, 0.95) 100%);
            backdrop-filter: blur(20px);
            z-index: 50;
            border-bottom: 2px solid #000000;
            box-shadow: 
                0 4px 20px rgba(52, 152, 219, 0.3),
                0 0 30px rgba(41, 128, 185, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: airforceHeader 5s ease-in-out infinite;
        }
        
        @keyframes airforceHeader {
            0%, 100% { box-shadow: 0 4px 20px rgba(52, 152, 219, 0.3), 0 0 30px rgba(41, 128, 185, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 6px 25px rgba(52, 152, 219, 0.4), 0 0 40px rgba(41, 128, 185, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15); }
        }
        .top-bar-inner {
            padding: 12px 16px;
        }
        .top-bar h1 {
            font-size: 1.25em;
            font-weight: 700;
            text-shadow: 
                1px 1px 2px rgba(0, 0, 0, 0.3),
                0 0 15px rgba(52, 152, 219, 0.4);
            color: #ffffff;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }
        
        @keyframes titleGlow {
            0% { text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3), 0 0 15px rgba(52, 152, 219, 0.4); }
            100% { text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3), 0 0 25px rgba(52, 152, 219, 0.6); }
        }
        
        .top-bar .subtitle {
            font-size: 0.8em;
            color: #bdc3c7;
            font-weight: 400;
            text-shadow: 
                1px 1px 1px rgba(0, 0, 0, 0.2),
                0 0 8px rgba(52, 152, 219, 0.3);
            animation: subtitleFlicker 4s ease-in-out infinite;
        }
        
        @keyframes subtitleFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 2px solid #000000;
            background: linear-gradient(90deg, rgba(52, 152, 219, 0.2), rgba(41, 128, 185, 0.2));
            position: relative;
            overflow: hidden;
        }
        
        .tabs::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #3498db, transparent);
            animation: airforceSweep 4s linear infinite;
        }
        
        @keyframes airforceSweep {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-size: 0.9em;
            font-weight: 600;
            color: #ecf0f1;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            background: none;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
        }
        
        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(52, 152, 219, 0.2), transparent);
            transition: left 0.4s;
        }
        
        .tab:hover::before {
            left: 100%;
        }
        
        .tab:hover { 
            background: linear-gradient(45deg, rgba(52, 152, 219, 0.3), rgba(41, 128, 185, 0.3));
            transform: translateY(-1px);
            color: #ffffff;
        }
        .tab.active { 
            color: #ffffff; 
            font-weight: 700;
            background: linear-gradient(45deg, rgba(52, 152, 219, 0.4), rgba(41, 128, 185, 0.4));
            transform: translateY(-1px);
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #3498db, #2980b9, #3498db);
            border-radius: 2px;
            box-shadow: 
                0 0 15px rgba(52, 152, 219, 0.4),
                0 0 30px rgba(41, 128, 185, 0.2);
            animation: tabGlow 3s ease-in-out infinite;
        }
        
        @keyframes tabGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(52, 152, 219, 0.4), 0 0 30px rgba(41, 128, 185, 0.2); }
            50% { box-shadow: 0 0 20px rgba(52, 152, 219, 0.6), 0 0 40px rgba(41, 128, 185, 0.3); }
        }

        /* ── Compose ────────────────────────────────── */
        .compose {
            padding: 16px;
            border-bottom: 2px solid #000000;
            display: flex;
            gap: 12px;
            background: linear-gradient(135deg, rgba(26, 35, 50, 0.8), rgba(44, 62, 80, 0.8));
            position: relative;
            overflow: hidden;
        }
        
        .compose::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.03) 0%, transparent 70%);
            animation: airforceRotate 12s linear infinite;
        }
        
        @keyframes airforceRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            font-weight: 700;
            color: #fff;
            position: relative;
            z-index: 3;
            transition: all 0.3s;
        }
        
        .post:hover .avatar {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 2px 10px rgba(52, 152, 219, 0.3);
        }
        .avatar.compose-avatar { 
            background: linear-gradient(135deg, #3498db, #2980b9, #1f618d);
            box-shadow: 
                0 2px 10px rgba(52, 152, 219, 0.3),
                0 0 20px rgba(41, 128, 185, 0.2),
                inset 0 0 10px rgba(255, 255, 255, 0.1);
            border: 2px solid #000000;
            animation: pilotPulse 3s ease-in-out infinite;
        }
        
        @keyframes pilotPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 2px 10px rgba(52, 152, 219, 0.3), 0 0 20px rgba(41, 128, 185, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.1); }
            50% { transform: scale(1.02); box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4), 0 0 30px rgba(41, 128, 185, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.2); }
        }

        .compose-body { flex: 1; min-width: 0; }
        
        /* Image Upload Section */
        .image-upload {
            margin-bottom: 12px;
            position: relative;
            z-index: 3;
        }
        
        .image-upload-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.2), rgba(41, 128, 185, 0.2));
            border: 1px solid #000000;
            border-radius: 20px;
            color: #ecf0f1;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85em;
            font-weight: 500;
            width: fit-content;
        }
        
        .image-upload-btn:hover {
            background: linear-gradient(45deg, rgba(52, 152, 219, 0.3), rgba(41, 128, 185, 0.3));
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.3);
            border-color: #5dade2;
            color: #ffffff;
        }
        
        .image-upload-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }
        
        #imageInput {
            display: none;
        }
        
        .image-preview {
            margin-top: 8px;
            position: relative;
            display: none;
        }
        
        .image-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            border: 2px solid #000000;
            box-shadow: 0 2px 10px rgba(52, 152, 219, 0.2);
        }
        
        .image-preview .remove-image {
            position: absolute;
            top: 8px;
            right: 8px;
            background: linear-gradient(135deg, #dc3545, #c82333);
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.2);
        }
        
        .image-preview .remove-image:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }
        .compose textarea {
            width: 100%;
            border: 2px solid #000000;
            outline: none;
            font-family: inherit;
            font-size: 1.15em;
            resize: none;
            min-height: 52px;
            color: #ecf0f1;
            line-height: 1.4;
            background: linear-gradient(135deg, rgba(26, 35, 50, 0.9), rgba(44, 62, 80, 0.9));
            border-radius: 8px;
            padding: 12px;
            position: relative;
            z-index: 3;
            transition: all 0.3s;
        }
        
        .compose textarea:focus {
            border-color: #5dade2;
            box-shadow: 
                0 0 0 3px rgba(93, 173, 226, 0.2),
                inset 0 0 10px rgba(52, 152, 219, 0.1);
            transform: scale(1.01);
        }
        
        .compose textarea::placeholder { 
            color: #bdc3c7;
            opacity: 0.8;
        }

        .compose-options {
            margin: 12px 0;
            padding: 12px 0;
            border-top: 1px solid #000000;
            border-bottom: 1px solid #000000;
        }
        
        .eligibility-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        
        .eligibility-label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .eligibility-label:hover {
            transform: translateX(4px);
        }
        
        .eligibility-label input[type="checkbox"]:checked + .eligibility-text::after {
            content: ' - Graduate (20-24)';
            color: #3498db;
            font-weight: 700;
            margin-left: 8px;
            animation: graduateGlow 2s ease-in-out infinite;
        }
        
        @keyframes graduateGlow {
            0%, 100% { text-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
            50% { text-shadow: 0 0 10px rgba(52, 152, 219, 0.6); }
        }
        
        .eligibility-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            appearance: none;
            border: 2px solid #000000;
            border-radius: 4px;
            background: linear-gradient(135deg, rgba(26, 35, 50, 0.8), rgba(44, 62, 80, 0.8));
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }
        
        .eligibility-label input[type="checkbox"]:checked {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-color: #3498db;
        }
        
        .eligibility-label input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
        }
        
        .eligibility-text {
            color: #ecf0f1;
            font-size: 0.9em;
            font-weight: 500;
            text-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
        }
        
        .eligibility-label:hover .eligibility-text {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(52, 152, 219, 0.4);
        }


        .compose-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #000000;
            position: relative;
            z-index: 3;
        }
        .compose-left { display: flex; align-items: center; gap: 12px; }

        /* Circular char counter */
        .char-ring {
            width: 32px;
            height: 32px;
            position: relative;
            z-index: 3;
        }
        .char-ring svg { 
            transform: rotate(-90deg);
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));
        }
        .char-ring circle {
            fill: none;
            stroke-width: 2.5;
        }
        .char-ring .bg { stroke: #34495e; }
        .char-ring .fill { 
            stroke: #3498db; 
            transition: stroke-dashoffset 0.3s, stroke 0.3s, filter 0.3s;
            filter: drop-shadow(0 0 3px currentColor);
        }
        .char-ring .fill.warn { 
            stroke: #f39c12;
            filter: drop-shadow(0 0 5px #f39c12);
        }
        .char-ring .fill.limit { 
            stroke: #e74c3c;
            filter: drop-shadow(0 0 8px #e74c3c);
            animation: warningPulse 1s ease-in-out infinite;
        }
        
        @keyframes warningPulse {
            0%, 100% { filter: drop-shadow(0 0 8px #e74c3c); }
            50% { filter: drop-shadow(0 0 12px #e74c3c); }
        }
        .char-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            font-size: 0.55em;
            color: #ecf0f1;
            font-weight: 600;
            text-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
            animation: counterGlow 3s ease-in-out infinite alternate;
        }
        
        @keyframes counterGlow {
            0% { text-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
            100% { text-shadow: 0 0 8px rgba(52, 152, 219, 0.5); }
        }

        .post-btn {
            padding: 10px 24px;
            background: linear-gradient(45deg, #3498db, #2980b9, #1f618d);
            background-size: 300% 300%;
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.88em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            z-index: 3;
            animation: airforceGradient 4s ease-in-out infinite;
        }
        
        @keyframes airforceGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .post-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            transition: all 0.3s;
            transform: translate(-50%, -50%);
        }
        
        .post-btn:hover::before {
            width: 200px;
            height: 200px;
        }
        
        .post-btn:hover { 
            transform: scale(1.05) translateY(-1px);
            box-shadow: 
                0 4px 15px rgba(52, 152, 219, 0.3),
                0 0 30px rgba(41, 128, 185, 0.2),
                0 5px 15px rgba(0, 0, 0, 0.2);
            border-color: #5dade2;
        }
        .post-btn:disabled { 
            opacity: 0.5; 
            cursor: default;
            transform: scale(1);
            animation: none;
        }

        /* ── Post Card ──────────────────────────────── */
        .post {
            display: flex;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid #000000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeIn 0.5s ease;
            background: linear-gradient(135deg, rgba(26, 35, 50, 0.8), rgba(44, 62, 80, 0.8));
            position: relative;
            overflow: hidden;
        }
        
        .post::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(52, 152, 219, 0.05), transparent);
            transition: left 0.6s;
        }
        
        .post:hover::before {
            left: 100%;
        }
        
        .post:hover { 
            background: linear-gradient(45deg, rgba(52, 152, 219, 0.15), rgba(41, 128, 185, 0.15));
            transform: translateX(4px) scale(1.01);
            box-shadow: 
                0 4px 20px rgba(52, 152, 219, 0.2),
                0 0 30px rgba(41, 128, 185, 0.1),
                inset 0 0 15px rgba(223, 230, 233, 0.05);
        }

        .post-body { flex: 1; min-width: 0; }

        .post-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }
        .post-name {
            font-weight: 700;
            font-size: 0.92em;
        }
        .post-handle {
            color: #ffd700;
            font-size: 0.85em;
        }
        .post-dot {
            color: #ffd700;
            font-size: 0.7em;
        }
        .post-time {
            color: #ffd700;
            font-size: 0.85em;
        }

        .post-mood {
            display: inline-block;
            font-size: 0.73em;
            padding: 1px 8px;
            border-radius: 10px;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .m-love { background: #fde8ee; color: #e0446d; }
        .m-happy { background: #fff8e1; color: #f9a825; }
        .m-sad { background: #e3f2fd; color: #1976d2; }
        .m-angry { background: #fbe9e7; color: #d84315; }
        .m-anxious { background: #f3e5f5; color: #8e24aa; }
        .m-excited { background: #e8f5e9; color: #2e7d32; }

        .post-text {
            font-size: 0.95em;
            line-height: 1.55;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
            z-index: 3;
            transition: all 0.3s;
        }
        
        .post:hover .post-text {
            text-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
        }

        /* Emoji reactions row (below text) */
        .post-reactions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .emoji-btn {
            width: 36px;
            height: 30px;
            border-radius: 15px;
            border: 1px solid #000000;
            background: linear-gradient(135deg, rgba(26, 35, 50, 0.8), rgba(44, 62, 80, 0.8));
            cursor: pointer;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #ecf0f1;
            position: relative;
            overflow: hidden;
            z-index: 3;
        }
        
        .emoji-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.1) 0%, transparent 70%);
            transition: all 0.3s;
            transform: translate(-50%, -50%);
        }
        
        .emoji-btn:hover::before {
            width: 50px;
            height: 50px;
        }
        
        .emoji-btn:hover { 
            background: linear-gradient(45deg, rgba(52, 152, 219, 0.2), rgba(41, 128, 185, 0.2));
            border-color: #5dade2;
            transform: scale(1.05) translateY(-1px);
            box-shadow: 
                0 2px 8px rgba(52, 152, 219, 0.2),
                0 0 15px rgba(41, 128, 185, 0.1);
            color: #ffffff;
        }
        
        .emoji-btn.reacted {
            background: linear-gradient(45deg, rgba(52, 152, 219, 0.3), rgba(41, 128, 185, 0.3));
            border-color: #5dade2;
            transform: scale(1.02);
            animation: targetLock 0.4s ease;
        }
        
        @keyframes targetLock {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1.02); }
        }
        .emoji-btn.reacted { background: #fde8ee; border-color: #e0446d; }
        .emoji-btn .e-count {
            font-size: 0.7em;
            font-weight: 600;
        }

        /* Action bar (reply, repost, like, bookmark) */
        .actions {
            display: flex;
            justify-content: space-between;
            max-width: 400px;
            margin-top: 8px;
        }
        .action {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #000000;
            background: linear-gradient(135deg, rgba(26, 35, 50, 0.8), rgba(44, 62, 80, 0.8));
            cursor: pointer;
            font-size: 0.82em;
            color: #ecf0f1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            font-weight: 500;
            position: relative;
            overflow: hidden;
            z-index: 3;
        }
        
        .action::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.05) 0%, transparent 70%);
            transition: all 0.3s;
            transform: translate(-50%, -50%);
        }
        
        .action:hover::before {
            width: 80px;
            height: 80px;
        }
        
        .action:hover { 
            background: linear-gradient(45deg, rgba(52, 152, 219, 0.2), rgba(41, 128, 185, 0.2));
            transform: translateY(-1px) scale(1.02);
            box-shadow: 
                0 2px 8px rgba(52, 152, 219, 0.2),
                0 0 15px rgba(41, 128, 185, 0.1);
            border-color: #5dade2;
            color: #ffffff;
        }
        
        .action.liked {
            background: linear-gradient(45deg, rgba(52, 152, 219, 0.3), rgba(41, 128, 185, 0.3));
            border-color: #5dade2;
            animation: missionComplete 0.4s ease;
        }
        
        @keyframes missionComplete {
            0% { transform: scale(1); }
            50% { transform: scale(1.05) rotate(1deg); }
            100% { transform: scale(1.02); }
        }
        .action svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
        .action:hover.reply-action { color: #1d9bf0; background: rgba(29,155,240,0.1); }
        .action:hover.repost-action { color: #00ba7c; background: rgba(0,186,124,0.1); }
        .action:hover.like-action { color: #f91880; background: rgba(249,24,128,0.1); }
        .action:hover.bookmark-action { color: #1d9bf0; background: rgba(29,155,240,0.1); }
        .action.liked { color: #f91880; }
        .action.liked svg { fill: #f91880; stroke: #f91880; }
        .action.reposted { color: #00ba7c; }
        .action.bookmarked { color: #1d9bf0; }
        .action.bookmarked svg { fill: #1d9bf0; }
        .action span { font-size: 0.95em; }

        /* ── Replies ────────────────────────────────── */
        .replies-section {
            display: none;
            padding: 0 0 8px;
        }
        .replies-section.open { display: block; }

        .reply {
            display: flex;
            gap: 10px;
            padding: 10px 0 10px 52px;
            border-top: 2px solid #0047ab;
            background: rgba(26, 26, 46, 0.2);
        }
        .reply-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec1d24, #0047ab);
            color: #ffffff;
            font-size: 0.65em;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 700;
            border: 1px solid #ffd700;
        }
        .reply-body { flex: 1; min-width: 0; }
        .reply-name { font-weight: 600; font-size: 0.82em; }
        .reply-handle { color: #ffd700; font-size: 0.78em; }
        .reply-text { font-size: 0.88em; line-height: 1.45; margin-top: 2px; }
        .reply-time { font-size: 0.72em; color: #ffd700; margin-top: 2px; }

        .reply-compose {
            display: flex;
            gap: 10px;
            padding: 10px 0 4px 52px;
            border-top: 2px solid #0047ab;
            align-items: center;
            background: rgba(26, 26, 46, 0.1);
        }
        .reply-compose input {
            flex: 1;
            border: 2px solid #ec1d24;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 0.85em;
            outline: none;
            font-family: inherit;
            color: #ffffff;
            background: rgba(26, 26, 46, 0.7);
        }
        .reply-compose input:focus { 
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        .reply-compose input::placeholder { color: #ffd700; }
        .reply-compose button {
            padding: 6px 16px;
            background: linear-gradient(45deg, #ec1d24, #0047ab);
            color: #ffffff;
            border: 2px solid #ffd700;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8em;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .reply-compose button:hover { 
            opacity: 0.9;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(236, 29, 36, 0.3);
        }

        /* ── Empty State ────────────────────────────── */
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #ffd700;
        }
        .empty .icon { font-size: 2.5em; margin-bottom: 10px; }
        .empty p { font-size: 0.92em; }
        .empty b { color: #ffffff; }

        /* ── Toast ──────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: linear-gradient(45deg, #3498db, #2980b9, #1f618d);
            background-size: 300% 300%;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 0.88em;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            border: 2px solid #000000;
            box-shadow: 
                0 4px 20px rgba(52, 152, 219, 0.3),
                0 0 40px rgba(41, 128, 185, 0.2),
                0 5px 20px rgba(0, 0, 0, 0.2);
            animation: airforceGradient 4s ease-in-out infinite;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .toast.show { 
            opacity: 1; 
            transform: translateX(-50%) translateY(0) scale(1.02);
            box-shadow: 
                0 6px 30px rgba(52, 152, 219, 0.4),
                0 0 60px rgba(41, 128, 185, 0.3),
                0 8px 30px rgba(0, 0, 0, 0.25);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="timeline">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-inner">
            <h1>Campus Confessions <span class="subtitle" id="count"></span></h1>
        </div>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('recent', this)">For You</button>
            <button class="tab" onclick="switchTab('top', this)">Trending</button>
        </div>
    </div>

    <!-- Compose -->
    <div class="compose">
        <div class="avatar compose-avatar">?</div>
        <div class="compose-body">
            <div class="image-upload">
                <label for="imageInput" class="image-upload-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14h4v-8h10v8h4V5c0-1.1-.9-2-2-2z"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                    </svg>
                    Add Image
                </label>
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
                <div class="image-preview" id="imagePreview">
                    <img id="previewImg" src="" alt="Preview">
                    <button class="remove-image" onclick="removeImage()" type="button">×</button>
                </div>
            </div>
            <textarea id="input" placeholder="What's happening on campus?" maxlength="280" rows="2"></textarea>
            <div class="compose-options">
                <div class="eligibility-section">
                    <label class="eligibility-label">
                        <input type="checkbox" id="eligibility" onchange="updatePostButton()">
                        <span class="checkmark"></span>
                        <span class="eligibility-text">Mark as eligible content</span>
                    </label>
                </div>
                <div class="age-limit-section">
                    <label class="age-limit-label">
                        <input type="checkbox" id="ageLimit" onchange="updatePostButton()">
                        <span class="checkmark"></span>
                        <span class="age-limit-text">Age limit: 18+</span>
                    </label>
                </div>
            </div>
            <div class="compose-footer">
                <div class="compose-left">
                    <div class="char-ring" id="charRing">
                        <svg width="28" height="28" viewBox="0 0 28 28">
                            <circle class="bg" cx="14" cy="14" r="11" />
                            <circle class="fill" cx="14" cy="14" r="11" stroke-dasharray="69.12" stroke-dashoffset="69.12" />
                        </svg>
                    </div>
                </div>
                <button class="post-btn" id="postBtn" onclick="createPost()" disabled>Post</button>
            </div>
        </div>
    </div>

    <!-- Feed -->
    <div id="feed"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/posts';
const MAX = 280;
const CIRCUMFERENCE = 2 * Math.PI * 11; // ~69.12

const input = document.getElementById('input');
const postBtn = document.getElementById('postBtn');
const fillCircle = document.querySelector('.char-ring .fill');

let sort = 'recent';
let selectedImage = null;
const liked = new Set();
const reposted = new Set();
const bookmarked = new Set();
const reacted = {}; // { postId: Set<type> }

// ── Image Upload Functions ───────────────────────

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(e) {
            selectedImage = e.target.result;
            const preview = document.getElementById('imagePreview');
            const previewImg = document.getElementById('previewImg');
            previewImg.src = e.target.result;
            preview.style.display = 'block';
            updatePostButton();
        };
        reader.readAsDataURL(file);
    }
}

function removeImage() {
    selectedImage = null;
    const preview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    previewImg.src = '';
    preview.style.display = 'none';
    document.getElementById('imageInput').value = '';
    updatePostButton();
}

function updatePostButton() {
    const textLength = input.value.trim().length;
    const hasContent = textLength > 0 || selectedImage;
    const withinLimit = textLength <= MAX;
    
    // Update character counter
    const pct = textLength / MAX;
    fillCircle.style.strokeDashoffset = CIRCUMFERENCE * (1 - pct);
    fillCircle.className.baseVal = 'fill' + (pct > 0.9 ? (pct >= 1 ? ' limit' : ' warn') : '');
    
    postBtn.disabled = !hasContent || !withinLimit;
}

function getEligibility() {
    const checkbox = document.getElementById('eligibility');
    const wasChecked = checkbox.dataset.checked === 'true';
    const isChecked = checkbox.checked;
    
    // Show toast when eligibility is checked
    if (isChecked && !wasChecked) {
        toast('Graduate! Age: 20-24 🎓');
    }
    
    // Update dataset to track previous state
    checkbox.dataset.checked = isChecked;
    
    return isChecked;
}

// ── Anonymous identity from post id ───────────────

const ANIMALS = ['Panda','Fox','Owl','Cat','Wolf','Bear','Deer','Hawk','Lynx','Dove','Swan','Crow','Frog','Duck','Seal'];
const COLORS = ['#e0446d','#1d9bf0','#00ba7c','#f9a825','#8e24aa','#d84315','#536471','#0d47a1','#ad1457','#2e7d32'];

function anonName(id) { return 'Anon ' + ANIMALS[id % ANIMALS.length]; }
function anonHandle(id) { return '@anon' + id; }
function anonColor(id) { return COLORS[id % COLORS.length]; }
function anonInitial(id) { return ANIMALS[id % ANIMALS.length][0]; }

// ── Mood config ───────────────────────────────────



// ── Mood picker ───────────────────────────────────



// ── Character ring ────────────────────────────────

input.addEventListener('input', () => {
    updatePostButton();
    // Auto-resize textarea
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
});

input.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter' && !postBtn.disabled) {
        e.preventDefault();
        createPost();
    }
});

// ── Tabs ──────────────────────────────────────────

function switchTab(s, btn) {
    sort = s;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    loadPosts();
}

// ── Helpers ───────────────────────────────────────

function timeAgo(ts) {
    const s = Math.floor((Date.now() - new Date(ts + 'Z')) / 1000);
    if (s < 60) return 'now';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h';
    const d = Math.floor(h / 24);
    if (d < 7) return d + 'd';
    return new Date(ts + 'Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function esc(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
}

function fmtCount(n) { return n > 0 ? n : ''; }

// ── SVG Icons ─────────────────────────────────────

const ICON = {
    reply:    '<svg viewBox="0 0 24 24"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.25-.893 4.34-2.457 5.86l-4.91 4.77a.75.75 0 01-1.134-.506l-.27-1.874a.75.75 0 01.476-.795C16.57 16.57 18.5 14.5 18.5 12c0-2.76-2.24-5-5-5H10c-2.76 0-5 2.24-5 5v.5c0 .28-.22.5-.5.5H2.25a.5.5 0 01-.5-.5V10z"/></svg>',
    repost:   '<svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2h4v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H12.5V4h4c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"/></svg>',
    like:     '<svg viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C10.001 6.01 8.534 5.44 7.303 5.5c-1.533.09-2.904 1.04-3.49 2.64-.587 1.6-.235 3.46 1.098 5.22 1.333 1.76 3.524 3.59 6.09 5.24 2.564-1.65 4.756-3.48 6.089-5.24 1.333-1.76 1.685-3.62 1.098-5.22-.586-1.6-1.957-2.55-3.49-2.64z"/></svg>',
    bookmark: '<svg viewBox="0 0 24 24"><path d="M4 4.5C4 3.12 5.119 2 6.5 2h11C18.881 2 20 3.12 20 4.5v18.44l-8-5.71-8 5.71V4.5z"/></svg>'
};

// ── Load Posts ────────────────────────────────────

async function loadPosts() {
    try {
        const res = await fetch(`${API}?sort=${sort}`);
        const posts = await res.json();
        const feed = document.getElementById('feed');
        document.getElementById('count').textContent = posts.length ? `\u00b7 ${posts.length} posts` : '';

        if (!posts.length) {
            feed.innerHTML = '<div class="empty"><div class="icon">&#128172;</div><p><b>No confessions yet.</b><br>Be the first to post.</p></div>';
            return;
        }

        feed.innerHTML = posts.map(p => {
            const emojisHtml = [
                { type: 'haha',  icon: '&#128514;' },
                { type: 'sad',   icon: '&#128546;' },
                { type: 'angry', icon: '&#128545;' },
                { type: 'fire',  icon: '&#128293;' }
            ].map(e => {
                const c = (p.reactions && p.reactions[e.type]) || 0;
                const done = reacted[p.id] && reacted[p.id].has(e.type);
                return `<button class="emoji-btn ${done ? 'reacted' : ''}" onclick="react(${p.id},'${e.type}',this)">${e.icon}${c ? '<span class="e-count">'+c+'</span>' : ''}</button>`;
            }).join('');

            return `
            <div class="post" id="post-${p.id}">
                <div class="avatar" style="background:${anonColor(p.id)}">${anonInitial(p.id)}</div>
                <div class="post-body">
                    <div class="post-header">
                        <span class="post-name">${anonName(p.id)}</span>
                        <span class="post-handle">${anonHandle(p.id)}</span>
                        <span class="post-dot">&middot;</span>
                        <span class="post-time">${timeAgo(p.timestamp)}</span>
                    </div>
                    ${moodHtml}
                    <div class="post-text">${esc(p.text)}</div>
                    <div class="post-reactions">${emojisHtml}</div>
                    <div class="actions">
                        <button class="action reply-action" onclick="toggleReplies(${p.id})">
                            ${ICON.reply} <span>${fmtCount(p.reply_count)}</span>
                        </button>
                        <button class="action repost-action ${reposted.has(p.id)?'reposted':''}" onclick="doRepost(${p.id},this)">
                            ${ICON.repost} <span>${fmtCount(p.reposts)}</span>
                        </button>
                        <button class="action like-action ${liked.has(p.id)?'liked':''}" onclick="doLike(${p.id},this)">
                            ${ICON.like} <span>${fmtCount(p.likes)}</span>
                        </button>
                        <button class="action bookmark-action ${bookmarked.has(p.id)?'bookmarked':''}" onclick="doBookmark(${p.id},this)">
                            ${ICON.bookmark}
                        </button>
                    </div>
                    <div class="replies-section" id="replies-${p.id}">
                        <div id="replies-list-${p.id}"></div>
                        <div class="reply-compose">
                            <input type="text" id="reply-input-${p.id}" placeholder="Post your reply" maxlength="280" onkeydown="if(event.key==='Enter')sendReply(${p.id})" />
                            <button onclick="sendReply(${p.id})">Reply</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    } catch (e) {
        console.error('Load failed:', e);
    }
}

// ── Create Post ───────────────────────────────────

async function createPost() {
    const text = input.value.trim();
    if (!text && !selectedImage) return;
    postBtn.disabled = true;
    try {
        const formData = new FormData();
        formData.append('text', text);
        formData.append('eligible', getEligibility() ? 'true' : 'false');
        if (selectedImage) {
            // Convert base64 to blob and append as file
            const response = await fetch(selectedImage);
            const blob = await response.blob();
            formData.append('image', blob, 'image.jpg');
        }
        
        await fetch(API, {
            method: 'POST',
            body: formData
        });
        
        // Reset form
        input.value = '';
        input.style.height = 'auto';
        fillCircle.style.strokeDashoffset = CIRCUMFERENCE;
        fillCircle.className.baseVal = 'fill';
        selectedImage = null;
        document.getElementById('eligibility').checked = false;
        removeImage();
        toast('Posted!');
        loadPosts();
    } catch (e) { 
        console.error('Upload error:', e);
        toast('Failed to post'); 
    }
}

// ── Like ──────────────────────────────────────────

async function doLike(id, btn) {
    if (liked.has(id)) return;
    liked.add(id);
    btn.classList.add('liked');
    try {
        const res = await fetch(`${API}/${id}/like`, { method: 'POST' });
        const data = await res.json();
        btn.querySelector('span').textContent = fmtCount(data.likes);
    } catch (e) {
        liked.delete(id);
        btn.classList.remove('liked');
    }
}

// ── Repost ────────────────────────────────────────

async function doRepost(id, btn) {
    if (reposted.has(id)) return;
    reposted.add(id);
    btn.classList.add('reposted');
    try {
        const res = await fetch(`${API}/${id}/repost`, { method: 'POST' });
        const data = await res.json();
        btn.querySelector('span').textContent = fmtCount(data.reposts);
        toast('Reposted!');
    } catch (e) {
        reposted.delete(id);
        btn.classList.remove('reposted');
    }
}

// ── Bookmark (client-side only) ───────────────────

function doBookmark(id, btn) {
    if (bookmarked.has(id)) {
        bookmarked.delete(id);
        btn.classList.remove('bookmarked');
        toast('Removed from bookmarks');
    } else {
        bookmarked.add(id);
        btn.classList.add('bookmarked');
        toast('Added to bookmarks');
    }
}

// ── Reactions ─────────────────────────────────────

async function react(id, type, btn) {
    if (!reacted[id]) reacted[id] = new Set();
    if (reacted[id].has(type)) return;
    reacted[id].add(type);
    btn.classList.add('reacted');
    try {
        const res = await fetch(`${API}/${id}/react`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type })
        });
        const data = await res.json();
        const c = (data.reactions && data.reactions[type]) || 0;
        const countEl = btn.querySelector('.e-count');
        if (countEl) countEl.textContent = c;
        else if (c) btn.insertAdjacentHTML('beforeend', `<span class="e-count">${c}</span>`);
    } catch (e) {
        reacted[id].delete(type);
        btn.classList.remove('reacted');
    }
}

// ── Replies ───────────────────────────────────────

function toggleReplies(id) {
    const sec = document.getElementById(`replies-${id}`);
    if (sec.classList.contains('open')) { sec.classList.remove('open'); return; }
    sec.classList.add('open');
    fetchReplies(id);
}

async function fetchReplies(id) {
    try {
        const res = await fetch(`${API}/${id}/replies`);
        const replies = await res.json();
        const list = document.getElementById(`replies-list-${id}`);
        if (!replies.length) {
            list.innerHTML = '<div style="padding:10px 0 0 52px;color:#9aa3ad;font-size:0.85em;">No replies yet</div>';
        } else {
            list.innerHTML = replies.map(r => `
                <div class="reply">
                    <div class="reply-avatar">${anonInitial(r.id)}</div>
                    <div class="reply-body">
                        <span class="reply-name">${anonName(r.id)}</span>
                        <span class="reply-handle">${anonHandle(r.id)}</span>
                        <div class="reply-text">${esc(r.text)}</div>
                        <div class="reply-time">${timeAgo(r.timestamp)}</div>
                    </div>
                </div>
            `).join('');
        }
    } catch (e) { console.error(e); }
}

async function sendReply(id) {
    const inp = document.getElementById(`reply-input-${id}`);
    const text = inp.value.trim();
    if (!text) return;
    try {
        await fetch(`${API}/${id}/reply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        inp.value = '';
        await fetchReplies(id);
        // Update reply count in action bar
        const res = await fetch(`${API}/${id}/replies`);
        const replies = await res.json();
        const postEl = document.getElementById(`post-${id}`);
        const replyBtn = postEl.querySelector('.reply-action span');
        replyBtn.textContent = fmtCount(replies.length);
        toast('Reply posted!');
    } catch (e) { toast('Failed to reply'); }
}

// ── Toast ─────────────────────────────────────────

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Init ──────────────────────────────────────────
loadPosts();
